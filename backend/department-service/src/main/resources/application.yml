server:
  port: 8082

spring:
  application:
    name: DEPARTMENT-SERVICE

  datasource:
    url: jdbc:postgresql://localhost:5432/department_db_dev
    username: postgres
    password: Rajababu@2026

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

